name: Validate interactive labs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify embedded design system matches source
        run: npm run check:styles
      - name: Run browser regression tests
        run: npm test
      - name: Audit WCAG 2.2 AA across all lab modes (AAA advisory)
        run: npm run audit:a11y
